<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISTEM 2026: Drowsiness Detection</title>

    <!-- โหลด Library ของ MediaPipe และ ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* ซ่อนวิดีโอต้นฉบับ โชว์แค่ Canvas ที่วาดกราฟิกทับแล้ว */
        video {
            display: none;
        }

        canvas#output_canvas {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            background-color: #000;
        }

        #status {
            font-size: 28px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 10px;
            background-color: #333;
            transition: 0.3s;
        }

        .stats {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 10px 18px;
            min-width: 84px;
        }

        .stat-box .v {
            font-size: 22px;
            font-weight: 700;
        }

        .stat-box .l {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .awake {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        .sleepy {
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>👁️ AI จับตาง่วงนอน (ISTEM 2026)</h1>

        <!-- ส่วนแสดงผลกล้อง -->
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>

        <!-- Canvas ลับสำหรับครอปรูปตา (64x64) ส่งให้ AI -->
        <canvas id="eye_crop_canvas" width="64" height="64" style="display: none;"></canvas>

        <!-- ป้ายแจ้งสถานะ -->
        <div id="status">กำลังโหลดโมเดล... ⏳</div>

        <!-- สถิติเชิงเวลา: เอาไว้อธิบายกรรมการว่าเราไม่ได้ตัดสินจากเฟรมเดียว -->
        <div class="stats">
            <div class="stat-box">
                <div class="v" id="perclosStat">0%</div>
                <div class="l">PERCLOS (12s)</div>
            </div>
            <div class="stat-box">
                <div class="v" id="eventStat">0</div>
                <div class="l">Sleepy Events</div>
            </div>
            <div class="stat-box">
                <div class="v" id="durStat">0.0s</div>
                <div class="l">หลับตาต่อเนื่อง</div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const eyeCropCanvas = document.getElementById('eye_crop_canvas');
        const eyeCropCtx = eyeCropCanvas.getContext('2d');
        const statusElement = document.getElementById('status');
        const perclosStat = document.getElementById('perclosStat');
        const eventStat = document.getElementById('eventStat');
        const durStat = document.getElementById('durStat');

        // ---------- แก้ปัญหาสำคัญสำหรับ iPhone Safari ----------
        // onnxruntime-web โดย default จะพยายามใช้ multi-threaded WASM
        // ซึ่งต้องมี HTTP header พิเศษ (Cross-Origin-Opener-Policy /
        // Cross-Origin-Embedder-Policy) ที่ static hosting ทั่วไป (เช่น
        // GitHub Pages) ไม่ได้ตั้งให้ ผลคือบน iOS Safari โมเดลจะโหลดไม่ผ่าน
        // หรือค้างเงียบๆ โดยไม่มี error ชัดเจน — บังคับ single-thread กัน
        // ปัญหานี้ (ช้าลงเล็กน้อยแต่ทำงานได้แน่นอนทุกอุปกรณ์)
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.simd = true;
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

        let onnxSession = null;

        // ---------- ระบบวิเคราะห์เชิงเวลา (Temporal Analysis) ----------
        // ตัดสิน "ง่วงจริง" จาก 2 เงื่อนไข แทนที่จะเชื่อเฟรมเดียว:
        //   1) PERCLOS: สัดส่วนเวลาที่ตาปิดใน 30 วินาทีล่าสุด > 15%
        //      (ตัวชี้วัดมาตรฐานจากงานวิจัยความปลอดภัยการขับขี่, FHWA 1994)
        //   2) Microsleep: ตาปิดต่อเนื่อง >= 0.5 วินาที ให้เตือนทันที
        const PERCLOS_WINDOW_MS = 12000; // ลดจาก 30s เหลือ 12s ให้เหมาะกับการ demo สด
        // (หลักการ PERCLOS ยังถูกต้อง แค่หน้าต่างสั้นลง
        // เพื่อให้ค่าตอบสนองไวขึ้น ไม่ค้างนานเกินไปตอนสาธิต)
        const PERCLOS_THRESHOLD = 0.15;
        const MICROSLEEP_SEC = 0.5;

        let closureLog = [];      // { t, closed }
        let closedSince = null;
        let sleepyEvents = 0;
        let wasAlerting = false;

        // ---------- แก้ปัญหา "ลืมตาแล้วแต่ยังค้างขึ้นว่าหลับ" ----------
        // สาเหตุเดิม: ตัดสินจาก CNN เฟรมเดียวตรงๆ ถ้ามีเฟรมไหนทายพลาด
        // (noise จากแสง/มุมกล้อง) จะกระทบสถานะทันที และค้างจนกว่าจะมีเฟรม
        // ที่ทาย "ลืมตา" ชัดเจน
        //
        // วิธีแก้: ใช้ debounce แบบไม่สมมาตร (asymmetric) — "เข้า" สถานะ
        // หลับต้องเห็นสัญญาณต่อเนื่องหลายเฟรม (กันทายพลาดแวบเดียว) แต่
        // "ออกจาก" สถานะหลับกลับมาปกติใช้แค่ไม่กี่เฟรมติดกันก็พอ เพื่อให้
        // ระบบตอบสนองไวที่สุดทันทีที่ลืมตาจริง ไม่ค้าง
        const REQUIRED_CLOSED_STREAK = 3; // ต้องทาย "หลับ" ติดกัน 3 เฟรมถึงจะนับ
        const REQUIRED_OPEN_STREAK = 2;   // แค่ทาย "ลืมตา" ติดกัน 2 เฟรม ก็กลับปกติทันที
        let closedStreak = 0;
        let openStreak = 0;
        let smoothedClosed = false;       // สถานะตาที่ผ่านการกรอง noise แล้ว

        let audioCtx = null;
        function beep(freq, dur) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) { }
        }
        let lastBeep = 0;

        // 1. โหลดโมเดล ONNX
        async function loadModel() {
            try {
                // ต้องแน่ใจว่าไฟล์ eye_model_2classes.onnx อยู่โฟลเดอร์เดียวกับ index.html
                onnxSession = await ort.InferenceSession.create('./eye_model_2classes.onnx');
                statusElement.innerText = "พร้อมใช้งาน! รอตรวจจับใบหน้า 👀";
                console.log("ONNX Model Loaded!");
            } catch (e) {
                console.error(e);
                statusElement.innerText = "❌ โหลดโมเดลไม่สำเร็จ เช็คไฟล์ ONNX";
            }
        }

        // 2. ฟังก์ชันเตรียมข้อมูลรูปภาพให้เหมือนตอนเทรน PyTorch (64x64, Normalization)
        function preprocessImage(canvasData) {
            const width = 64;
            const height = 64;
            const floatData = new Float32Array(3 * width * height);

            // วนลูปแยกสี RGB และทำ Normalization ((x/255) - 0.5) / 0.5
            for (let i = 0; i < width * height; i++) {
                let r = canvasData.data[i * 4 + 0] / 255.0;
                let g = canvasData.data[i * 4 + 1] / 255.0;
                let b = canvasData.data[i * 4 + 2] / 255.0;

                floatData[i] = (r - 0.5) / 0.5;                               // Red
                floatData[width * height + i] = (g - 0.5) / 0.5;              // Green
                floatData[2 * width * height + i] = (b - 0.5) / 0.5;          // Blue
            }
            // สร้าง Tensor [1, 3, 64, 64] สำหรับโมเดล
            return new ort.Tensor('float32', floatData, [1, 3, width, height]);
        }

        // 3. ฟังก์ชันประมวลผลเมื่อ MediaPipe เจอใบหน้า
        async function onResults(results) {
            const now = performance.now();

            // วาดวิดีโอลง Canvas แบบ mirror (ให้ดูเป็นธรรมชาติเหมือนกระจก
            // ตอน demo สด — ค่า landmark ที่ MediaPipe คืนมาอิงกับภาพต้นฉบับ
            // ที่ยังไม่ mirror ดังนั้น flip ทั้ง context แล้ววาดทุกอย่างทับ
            // ไปพร้อมกัน พิกัดจะสอดคล้องกันเองโดยไม่ต้องคำนวณกลับ)
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && onnxSession) {
                const landmarks = results.multiFaceLandmarks[0];

                // ---------- ครอปตาแยกทีละข้าง (สำคัญมาก) ----------
                // แก้จากเดิมที่ครอปตาทั้งสองข้างรวมกันเป็นกล่องเดียว (มีคิ้ว/
                // สันจมูกปนมาเยอะ) ซึ่ง "ไม่ตรงกับฟอร์แมตของ MRL Eye Dataset"
                // ที่ใช้เทรนโมเดล (เป็นภาพตาข้างเดียวครอปชิดๆ ไม่มีคิ้ว/จมูก)
                // ความต่างของฟอร์แมตนี้ทำให้โมเดลเจอภาพที่ "หน้าตาไม่เหมือน"
                // ตอนเทรนเลย จึงทายพลาดบ่อยแม้ตาลืมปกติ — ครอปแยกทีละข้างตา
                // แบบนี้จะให้ภาพที่ใกล้เคียงกับตอนเทรนมากที่สุด
                const LEFT_EYE = [33, 160, 158, 133, 153, 144];
                const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

                function eyeBox(indices) {
                    const xs = indices.map(i => landmarks[i].x);
                    const ys = indices.map(i => landmarks[i].y);
                    const minXn = Math.min(...xs), maxXn = Math.max(...xs);
                    const minYn = Math.min(...ys), maxYn = Math.max(...ys);
                    // padding พอประมาณรอบดวงตา (ไม่เอาคิ้ว/จมูกเข้ามาเยอะ)
                    const padXn = (maxXn - minXn) * 0.35;
                    const padYn = (maxYn - minYn) * 0.9;
                    const x = Math.max(0, (minXn - padXn) * canvasElement.width);
                    const y = Math.max(0, (minYn - padYn) * canvasElement.height);
                    const w = Math.min(canvasElement.width - x, (maxXn - minXn + 2 * padXn) * canvasElement.width);
                    const h = Math.min(canvasElement.height - y, (maxYn - minYn + 2 * padYn) * canvasElement.height);
                    return { x, y, w, h };
                }

                const leftBox = eyeBox(LEFT_EYE);
                const rightBox = eyeBox(RIGHT_EYE);

                // วาดกรอบทั้งสองข้างบนหน้าจอ (สีเขียว = เริ่มต้น)
                canvasCtx.strokeStyle = "#00ff88";
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeRect(leftBox.x, leftBox.y, leftBox.w, leftBox.h);
                canvasCtx.strokeRect(rightBox.x, rightBox.y, rightBox.w, rightBox.h);

                // ครอปและทำนายแยกทีละข้าง แล้วรวมผล (เฉลี่ยคะแนน)
                async function predictEye(box) {
                    if (box.w <= 0 || box.h <= 0) return { awakeScore: 1, sleepyScore: 0 };
                    eyeCropCtx.drawImage(canvasElement, box.x, box.y, box.w, box.h, 0, 0, 64, 64);
                    const imgData = eyeCropCtx.getImageData(0, 0, 64, 64);
                    const tensor = preprocessImage(imgData);
                    const outputData = await onnxSession.run({ input: tensor });
                    const scores = outputData.output.data;
                    return { awakeScore: scores[0], sleepyScore: scores[1] };
                }

                const [leftResult, rightResult] = await Promise.all([predictEye(leftBox), predictEye(rightBox)]);

                // เฉลี่ยผลต่าง (sleepy - awake) ของสองข้างตา ถ้าค่าเฉลี่ย > 0
                // ถือว่าหลับตา — ช่วยลด noise จากตาข้างเดียวที่อาจถูกบัง/มุมเอียง
                const avgDiff = ((leftResult.sleepyScore - leftResult.awakeScore) +
                    (rightResult.sleepyScore - rightResult.awakeScore)) / 2;
                const frameClosed = avgDiff > 0;

                // กรอบเปลี่ยนสีตามผลรวม (แดง = ตอนนี้ทายว่าหลับ)
                if (frameClosed) {
                    canvasCtx.strokeStyle = "#ff3333";
                    canvasCtx.strokeRect(leftBox.x, leftBox.y, leftBox.w, leftBox.h);
                    canvasCtx.strokeRect(rightBox.x, rightBox.y, rightBox.w, rightBox.h);
                }

                // ---------- กรอง noise ด้วย asymmetric debounce ----------
                if (frameClosed) {
                    closedStreak++;
                    openStreak = 0;
                } else {
                    openStreak++;
                    closedStreak = 0;
                }
                if (!smoothedClosed && closedStreak >= REQUIRED_CLOSED_STREAK) {
                    smoothedClosed = true;      // เพิ่งยืนยันว่าหลับจริง (ไม่ใช่ noise)
                }
                if (smoothedClosed && openStreak >= REQUIRED_OPEN_STREAK) {
                    smoothedClosed = false;     // ลืมตาแล้ว กลับปกติทันที
                }

                // ---------- อัปเดต Microsleep (ตาปิดต่อเนื่อง) ----------
                // ใช้ smoothedClosed แทน frameClosed ดิบ ทุกจุดต่อจากนี้
                if (smoothedClosed) {
                    if (closedSince === null) closedSince = now;
                } else {
                    closedSince = null;
                }
                const closedDur = closedSince !== null ? (now - closedSince) / 1000 : 0;
                durStat.innerText = closedDur.toFixed(1) + 's';

                // ---------- อัปเดต PERCLOS (สัดส่วนตาปิดใน 30 วิล่าสุด) ----------
                closureLog.push({ t: now, closed: smoothedClosed });
                while (closureLog.length && now - closureLog[0].t > PERCLOS_WINDOW_MS) closureLog.shift();
                const closedFrames = closureLog.filter(x => x.closed).length;
                const perclos = closureLog.length ? closedFrames / closureLog.length : 0;
                perclosStat.innerText = Math.round(perclos * 100) + '%';

                // ---------- ตัดสิน "ง่วงจริง" จาก 2 เงื่อนไข ไม่ใช่เฟรมเดียว ----------
                const isDrowsy = (closedDur >= MICROSLEEP_SEC) || (perclos > PERCLOS_THRESHOLD);

                if (isDrowsy && !wasAlerting) {
                    sleepyEvents++;
                    eventStat.innerText = sleepyEvents;
                }
                wasAlerting = isDrowsy;

                if (isDrowsy) {
                    const reason = closedDur >= MICROSLEEP_SEC
                        ? `😴 MICROSLEEP — หลับตาต่อเนื่อง ${closedDur.toFixed(1)}s`
                        : `😴 มีรูปแบบหลับตาถี่ช่วง ${PERCLOS_WINDOW_MS / 1000}s ที่ผ่านมา (PERCLOS ${Math.round(perclos * 100)}%)`;
                    statusElement.innerText = reason;
                    statusElement.className = "sleepy";
                    canvasCtx.strokeStyle = "#ff3333";
                    canvasCtx.strokeRect(leftBox.x, leftBox.y, leftBox.w, leftBox.h);
                    canvasCtx.strokeRect(rightBox.x, rightBox.y, rightBox.w, rightBox.h);
                    if (now - lastBeep > 1800) {
                        beep(closedDur >= MICROSLEEP_SEC ? 660 : 990, 0.25);
                        lastBeep = now;
                    }
                } else {
                    statusElement.innerText = "👀 ลืมตา / ปกติ (Awake)";
                    statusElement.className = "awake";
                }
            } else {
                // ไม่พบใบหน้าในเฟรมนี้ — อย่าปล่อยให้สถานะเก่าค้างอยู่
                statusElement.innerText = "🔍 ไม่พบใบหน้า — หันหน้าเข้ากล้อง";
                statusElement.className = "";
                closedSince = null;
                closedStreak = 0;
                openStreak = 0;
                smoothedClosed = false;
            }
            canvasCtx.restore();
        }

        // 4. ตั้งค่า Face Mesh และ กล้อง
        const faceMesh = new FaceMesh({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        // เริ่มต้นการทำงาน
        loadModel().then(() => camera.start());

    </script>
</body>

</html>
